<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'self'; form-action 'self'" />
  <title>Magic Gems</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="start-screen" class="start-screen">
    <h1 class="start-title">MAGIC GEMS</h1>
    <button id="start-single-btn" class="start-btn" type="button">Single-player</button>
    <button id="start-multiplayer-btn" class="start-btn" type="button">Multiplayer</button>
  </div>
  <div id="mp-lobby" class="mp-lobby" hidden>
    <div id="mp-lobby-error" class="mp-lobby-error"></div>
    <div id="mp-name-step" class="mp-step">
      <h2 class="mp-lobby-title">ENTER YOUR NAME</h2>
      <input id="mp-name-input" class="mp-text-input" type="text" maxlength="20" autocomplete="off" />
    </div>
    <div id="mp-choice-step" class="mp-step" hidden>
      <h2 class="mp-lobby-title">JOIN A GAME</h2>
      <button id="mp-generate-btn" class="start-btn" type="button">Generate code</button>
      <button id="mp-enter-btn" class="start-btn" type="button">Enter code</button>
    </div>
    <div id="mp-generate-step" class="mp-step" hidden>
      <h2 class="mp-lobby-title">YOUR CODE</h2>
      <div id="mp-generated-code" class="mp-code-display"></div>
      <div class="mp-lobby-status">Waiting for a second player...</div>
    </div>
    <div id="mp-enter-step" class="mp-step" hidden>
      <h2 class="mp-lobby-title">ENTER CODE</h2>
      <input id="mp-code-input" class="mp-text-input" type="text" maxlength="10" autocomplete="off" />
      <div id="mp-enter-error" class="mp-lobby-error"></div>
    </div>
    <div id="mp-ready-step" class="mp-step" hidden>
      <h2 class="mp-lobby-title">READY</h2>
      <div id="mp-ready-names" class="mp-ready-names"></div>
    </div>
  </div>
  <div id="game" hidden>
    <div id="autoplay-indicator" class="autoplay-indicator">Autoplaying...</div>
    <div id="hud">
      <span id="score">Score: 0</span>
      <div id="multiplier-bar" class="multiplier-bar">
        <div id="multiplier-fill" class="multiplier-fill"></div>
        <span id="multiplier-message" class="multiplier-message"></span>
      </div>
    </div>
    <canvas id="board"></canvas>
    <div id="audio-hint" class="control-hint">S — TOGGLE AUDIO</div>
    <div id="autoplay-hint" class="control-hint">A — TOGGLE AUTOPLAY</div>
    <div id="audio-toast" class="audio-toast"></div>
    <div id="exit-confirm" class="exit-confirm" hidden>Are you sure you want to exit the game? Y/N</div>
  </div>
  <script src="src/session.js"></script>
  <script src="src/session-api-client.js"></script>
  <script src="src/gems.js"></script>
  <script src="src/spin.js"></script>
  <script src="src/sprite-layout.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/board.js"></script>
  <script src="src/interaction.js"></script>
  <script src="src/resolution.js"></script>
  <script src="src/autoplay.js"></script>
  <script src="src/shatter.js"></script>
  <script src="src/animation.js"></script>
  <script src="src/scoring.js"></script>
  <script src="src/multiplier-bar.js"></script>
  <script src="src/audio-cues.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
